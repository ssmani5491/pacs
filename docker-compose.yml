# RIS + PACS Replica — local, offline stack.
# Start:  docker compose up -d --build
name: pacs-replica

# Phase 9 LOG-1: bound Docker container logs (json-file was unbounded by default).
# 10 MB x 5 files = max 50 MB of logs per container, rotated automatically.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # creates the RIS db; orthanc db is created by init script
      POSTGRES_DB: ${RIS_DB_NAME}
      ORTHANC_DB_NAME: ${ORTHANC_DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${RIS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [pacs]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pacs]

  orthanc:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORTHANC__POSTGRESQL__HOST: ${POSTGRES_HOST}
      ORTHANC__POSTGRESQL__PORT: ${POSTGRES_PORT}
      ORTHANC__POSTGRESQL__DATABASE: ${ORTHANC_DB_NAME}
      ORTHANC__POSTGRESQL__USERNAME: ${POSTGRES_USER}
      ORTHANC__POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__NAME: "PACS Replica"
      ORTHANC__DICOM_AET: ${ORTHANC_AET}
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME}": "${ORTHANC_PASSWORD}"}
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__WORKLISTS__ENABLE: "true"
      ORTHANC__WORKLISTS__DATABASE: "/var/lib/orthanc/worklists"
      # notify backend on new instances
      ORTHANC__LUA_SCRIPTS: '["/scripts/on-stored.lua"]'
      INGEST_SECRET: ${INGEST_SECRET}
    volumes:
      - orthanc_storage:/var/lib/orthanc/db
      - ./orthanc/worklist:/var/lib/orthanc/worklists
      - ./orthanc/on-stored.lua:/scripts/on-stored.lua:ro
    ports:
      - "${ORTHANC_DICOM_PORT}:4242"   # C-STORE SCP
    healthcheck:
      # Orthanc image ships no curl/wget; probe the HTTP port via bash /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8042 && echo -e 'GET /system HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '401\\|200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [pacs]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orthanc:
        condition: service_started
    env_file: .env
    volumes:
      - app_logs:/var/log/pacs
      - pacs_archive:/var/lib/pacs/archive
      - pacs_backups:/var/backups/pacs
      # Phase 1D nightly backup job reads Orthanc's raw DICOM storage directly
      # (filesystem-level copy, not thousands of per-study HTTP exports).
      # Read-only: the backup job must never be able to write into Orthanc's
      # own storage.
      - orthanc_storage:/var/lib/orthanc-storage-ro:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [pacs]

  mwl-scp:
    build:
      context: ./mwl-scp
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MWL_AET: ${MWL_AET}
      MWL_PORT: "4243"
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RIS_DB_NAME: ${RIS_DB_NAME}
      INSTITUTION_NAME: ${INSTITUTION_NAME}
    ports:
      - "${MWL_PORT:-4243}:4243"   # MWL C-FIND SCP
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',4243)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [pacs]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks: [pacs]

  # Phase 6 — OHIF Viewer (pinned source build, served under /viewer/).
  ohif:
    build:
      context: ./ohif
      dockerfile: Dockerfile
      args:
        OHIF_REF: ${OHIF_REF:-v3.13.14}
        PUBLIC_URL: /viewer/
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
      - orthanc
    volumes:
      # Runtime config: points OHIF at our authenticated /api/dicom-web proxy.
      - ./ohif/app-config.js:/usr/share/nginx/html/viewer/app-config.js:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/viewer/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pacs]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
      - frontend
      - orthanc
      - ohif
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [pacs]

volumes:
  pg_data:
  redis_data:
  orthanc_storage:
  app_logs:
  pacs_archive:   # PACS Operations Module 2 — compressed study archives (copy-only)
  pacs_backups:   # Product Validation Phase 1D — nightly DB dumps + DICOM storage archive

networks:
  pacs:
    driver: bridge
