; RIS + PACS all-in-one — process supervision. This is the complete
; supervisord config (entrypoint.sh invokes `supervisord -c
; /etc/supervisor/supervisord.conf`, which is this file — it does not rely on
; Debian's own default supervisord.conf).
;
; Postgres is NOT managed here — it runs in its own sibling container (see
; deploy/allinone/docker-compose.yml), started before this one via
; depends_on: condition: service_healthy. This image only holds the
; postgresql-client-16 package (pg_dump/pg_restore/psql/pg_isready).
;
; Startup priority (lower runs first): redis -> orthanc -> backend -> mwl-scp
; -> nginx. Backend, Orthanc, and mwl-scp additionally wait for the sibling
; Postgres container to accept connections via wait-for-postgres.sh — Compose's
; service_healthy only guarantees Postgres was healthy at container-create
; time, not that it stays reachable across a later Postgres restart, which
; wait-for-postgres.sh (and each program's autorestart=true) also covers.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/var/run/supervisord.pid
childlogdir=/data/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Web UI + XML-RPC API, bound to localhost only (proxied by nginx at
; /admin/services/ with its own password from rispacs.ini — see
; nginx.conf.template). Username/password come from entrypoint.sh's exported
; SUPERVISOR_UI_USER / SUPERVISOR_UI_PASSWORD env vars.
[inet_http_server]
port=127.0.0.1:9001
username=%(ENV_SUPERVISOR_UI_USER)s
password=%(ENV_SUPERVISOR_UI_PASSWORD)s

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --requirepass "%(ENV_REDIS_PASSWORD)s" --dir /data/redis
priority=20
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/data/logs/redis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/data/logs/redis.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:orthanc]
; Reuses the base image's own /docker-entrypoint.sh (translates ORTHANC__*
; env vars, set by our entrypoint.sh from rispacs.ini, into Orthanc's config;
; also handles DICOM host-id generation and log options) rather than
; hand-rolling orthanc.json and losing that logic.
command=/usr/local/bin/wait-for-postgres.sh /docker-entrypoint.sh /tmp/orthanc.json
priority=30
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/data/logs/orthanc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/data/logs/orthanc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:backend]
; run-backend.sh exports backend.env into the real process environment (not
; just a .env file) before calling docker-entrypoint.sh (unchanged from the
; dev image), which runs `prisma migrate deploy` then the idempotent seed
; (see seed.ts — safe to run every boot; never touches an existing admin's
; password/role) before starting the app.
command=/usr/local/bin/wait-for-postgres.sh /usr/local/bin/run-backend.sh
directory=/opt/backend
priority=40
autorestart=true
startsecs=5
startretries=5
environment=NODE_ENV="production"
stdout_logfile=/data/logs/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/data/logs/backend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:mwl-scp]
command=/usr/local/bin/wait-for-postgres.sh /usr/local/bin/run-mwl-scp.sh
priority=50
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/data/logs/mwl-scp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/data/logs/mwl-scp.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:nginx]
command=nginx -g "daemon off;"
priority=60
autorestart=true
startsecs=3
startretries=5
stopsignal=QUIT
stdout_logfile=/data/logs/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/data/logs/nginx.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
