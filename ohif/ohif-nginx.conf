# Internal nginx for the OHIF container. Serves the built viewer under /viewer/.
# The top-level stack nginx proxies /viewer/ here; OHIF's bundle was built with
# PUBLIC_URL=/viewer/ so all its asset URLs already carry that prefix.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Health/diagnostics.
  location = /healthz { return 200 "ohif-ok\n"; add_header Content-Type text/plain; }

  # app-config.js must never be cached (so config changes take effect on reload).
  location = /viewer/app-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Hashed build assets are immutable -> cache hard.
  location ~* ^/viewer/.*\.(js|css|woff2?|ttf|png|svg|gif|ico|wasm)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA history-API fallback: any /viewer/* path resolves to the viewer index.
  location /viewer/ {
    try_files $uri $uri/ /viewer/index.html;
  }

  location = / { return 302 /viewer/; }
}
