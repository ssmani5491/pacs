worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  client_max_body_size 2g;        # large DICOM uploads (STOW-RS)

  # --- Docker embedded DNS resolver ---------------------------------------
  # Docker's internal DNS lives at 127.0.0.11. By resolving upstream names
  # here (with a short cache TTL) AND using variables in proxy_pass, nginx
  # re-resolves the target on demand instead of caching the container IP at
  # startup. This is what prevents the intermittent 502 Bad Gateway after a
  # backend/orthanc/frontend container is rebuilt and gets a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Reasonable proxy timeouts (also apply to re-resolution attempts).
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # WebSocket upgrade map: "upgrade" when the client asks, else "close".
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Socket.IO (Phase 8 notifications gateway). WebSocket upgrade + dynamic DNS.
    location /socket.io/ {
      set $upstream_ws backend;
      proxy_pass http://$upstream_ws:3000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;            # keep long-lived sockets open
    }

    # DICOMweb proxy -> NestJS backend (Phase 6). More specific than /api/ so it
    # wins. Tuned for large streamed multipart pixel data: buffering off, longer
    # read timeout, no body size cap (STOW uploads).
    location /api/dicom-web/ {
      set $upstream_dicomweb backend;
      proxy_pass http://$upstream_dicomweb:3000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;                 # stream pixel data straight through
      proxy_request_buffering off;
      proxy_read_timeout 300s;             # large series retrieval
      client_max_body_size 0;              # STOW uploads (unbounded)
    }

    # RIS API -> NestJS backend.
    # NOTE: a variable in proxy_pass disables nginx's automatic URI assembly,
    # so the request URI ($request_uri, which includes /api/...) is passed
    # through verbatim — preserving the previous behaviour (no path stripped).
    location /api/ {
      set $upstream_backend backend;
      proxy_pass http://$upstream_backend:3000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;              # websockets
      proxy_set_header Connection $connection_upgrade;
    }

    # Phase 1C (Product Validation remediation): the direct-to-Orthanc DICOMweb
    # route that used to live here (location /dicom-web/ { proxy_pass straight
    # to orthanc:8042 }) has been removed. It bypassed the application's own
    # study.view permission check and audit logging entirely (Orthanc has no
    # concept of the app's users/roles/organizations — it was gated only by
    # Orthanc's single shared Basic Auth credential), and nothing in this
    # project used it: OHIF, the backend, and every test are all confirmed
    # (Phase 1B investigation, re-verified in Phase 1C) to use only the
    # authenticated backend proxy below. Orthanc's own DICOMweb plugin and the
    # ORTHANC__DICOM_WEB__ENABLE setting are unchanged and still required —
    # only this unauthenticated public nginx route to it was removed. See
    # docs/PRODUCT_VALIDATION_PHASE1C_ORTHANC_DICOMWEB.md.

    # --- OHIF viewer (Phase 6) ----------------------------------------------
    # OHIF is built with PUBLIC_URL=/viewer/ and its internal nginx serves under
    # /viewer/ too, so we pass the path through unchanged (no rewrite).
    location /viewer/ {
      set $upstream_ohif ohif;
      proxy_pass http://$upstream_ohif:80$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;              # websockets (dev HMR)
      proxy_set_header Connection $connection_upgrade;
    }

    # Front-end SPA (serves OHIF + enterprise shell).
    location / {
      set $upstream_frontend frontend;
      proxy_pass http://$upstream_frontend:80$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;              # Vite HMR / websockets
      proxy_set_header Connection $connection_upgrade;
      # Security headers for the SPA HTML/assets (Phase 9 SEC-4). The API already
      # sets its own via helmet; the OHIF viewer is under /viewer/ (separate
      # location) and is intentionally not constrained by this CSP. No HSTS on
      # plain HTTP (SEC-3); add it in the TLS server block when HTTPS is enabled.
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
    }
  }
}
